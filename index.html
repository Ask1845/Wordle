<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Six Letter Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Serif:ital@1&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Header, 6x6 board, win line below the board, keyboard pinned under it. */
:root {
  --bg: #F6F1F7;
  --fg: #2A1B33;
  --muted: #6E5F78;
  --line: #CDBFD3;
  --key: #E2D6E8;
  --correct: #2F8F5B;
  --present: #B8860B;
  --absent: #7A6B83;
  --accent: #C2306B;
  --on-tile: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-note: "Instrument Serif", Georgia, "Times New Roman", serif;
  --tile: min(68px, calc((100vw - 32px - 3 * 6px) / 4));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1220;
    --fg: #F3E9F5;
    --muted: #AE9DB8;
    --line: #4A3A55;
    --key: #3A2C44;
    --correct: #3FA56E;
    --present: #C99A2E;
    --absent: #4B3F54;
    --accent: #F06292;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1220;
  --fg: #F3E9F5;
  --muted: #AE9DB8;
  --line: #4A3A55;
  --key: #3A2C44;
  --correct: #3FA56E;
  --present: #C99A2E;
  --absent: #4B3F54;
  --accent: #F06292;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 20px 28px;
  min-height: 100vh;
}
main {
  max-width: 440px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}
header { text-align: center; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.toast {
  height: 1.4rem;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent);
  text-align: center;
}
.board {
  display: grid;
  grid-template-rows: repeat(6, var(--tile));
  gap: 6px;
}
.row {
  display: grid;
  grid-template-columns: repeat(4, var(--tile));
  gap: 6px;
}
.row.shake { animation: shake 0.45s; }
.tile {
  width: var(--tile);
  height: var(--tile);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: calc(var(--tile) * 0.55);
  text-transform: uppercase;
  user-select: none;
}
.tile[data-filled="true"] { border-color: var(--muted); animation: pop 0.12s; }
.tile[data-state="correct"] { background: var(--correct); border-color: var(--correct); color: var(--on-tile); }
.tile[data-state="present"] { background: var(--present); border-color: var(--present); color: var(--on-tile); }
.tile[data-state="absent"] { background: var(--absent); border-color: var(--absent); color: var(--on-tile); }
.tile.flip { animation: flip 0.5s ease-in-out both; }
.win {
  min-height: 3.6rem;
  max-width: 360px;
  text-align: center;
  font-family: var(--font-note);
  font-style: italic;
  font-size: 1.55rem;
  line-height: 1.25;
  color: var(--accent);
  text-wrap: balance;
}
.win[hidden] { display: none !important; }
.win.show { animation: rise 0.7s ease-out both; }
.lose { text-align: center; font-size: 0.95rem; color: var(--muted); }
.lose button {
  margin-top: 8px;
  font: inherit;
  font-weight: 700;
  background: var(--accent);
  color: var(--on-tile);
  border: 0;
  padding: 10px 18px;
  cursor: pointer;
}
.hints {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.hints button {
  font: 700 0.85rem var(--font-body);
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  padding: 8px 16px;
  cursor: pointer;
}
.hints button:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
.hints button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.95rem;
  line-height: 1.35;
}
.hint-list li { animation: rise 0.4s ease-out both; }
.hint-list .label {
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-right: 6px;
}
.kb { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1 1 0;
  min-width: 0;
  height: 50px;
  border: 0;
  background: var(--key);
  color: var(--fg);
  font: 700 0.9rem var(--font-body);
  cursor: pointer;
  text-transform: uppercase;
  padding: 0;
}
.key.wide { flex: 1.6 1 0; font-size: 0.72rem; letter-spacing: 0.04em; }
.key[data-state="correct"] { background: var(--correct); color: var(--on-tile); }
.key[data-state="present"] { background: var(--present); color: var(--on-tile); }
.key[data-state="absent"] { background: var(--absent); color: var(--on-tile); }
.key:focus-visible, .lose button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@keyframes flip {
  0% { transform: rotateX(0); }
  50% { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.flip, .row.shake, .win.show, .tile[data-filled="true"] { animation: none; }
}
</style>

</head>
<body>
<main>
  <header>
    <h1>Wordle</h1>
    <p class="sub">Four letters &middot; six tries</p>
  </header>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="board" id="board" aria-label="Game board"></div>
  <div class="win" id="win" hidden>Will you lend me a day of your life? I promise to make it one worth remembering</div>
  <div class="lose" id="lose" hidden></div>
  <div class="hints">
    <button type="button" id="hintBtn">Need a hint?</button>
    <ol class="hint-list" id="hintList" aria-live="polite"></ol>
  </div>
  <div class="kb" id="kb"></div>
</main>

<script>
(function () {
  var ANSWER = "DATE";
  var COLS = 4, ROWS = 6;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var STEP = reduce ? 0 : 250;

  var board = document.getElementById("board");
  var kb = document.getElementById("kb");
  var toast = document.getElementById("toast");
  var winEl = document.getElementById("win");
  var loseEl = document.getElementById("lose");

  var rows = [], tiles = [], keys = {};
  var current = "", rowIndex = 0, locked = false, over = false, toastTimer = null;

  var HINTS = [
    "It's something I'd like to do with you.",
    "It rhymes with fate, and maybe that's no accident.",
    "It starts with D and ends with E."
  ];
  var hintCount = 0;
  var hintBtn = document.getElementById("hintBtn");
  var hintList = document.getElementById("hintList");

  function renderHints() {
    hintList.innerHTML = "";
    for (var i = 0; i < hintCount; i++) {
      var li = document.createElement("li");
      var label = document.createElement("span");
      label.className = "label";
      label.textContent = "Hint " + (i + 1);
      li.appendChild(label);
      li.appendChild(document.createTextNode(HINTS[i]));
      hintList.appendChild(li);
    }
    var unlocked = Math.min(HINTS.length, rowIndex);
    if (hintCount >= HINTS.length) {
      hintBtn.disabled = true;
      hintBtn.textContent = "No more hints";
    } else if (hintCount < unlocked) {
      hintBtn.disabled = false;
      hintBtn.textContent = hintCount === 0 ? "Show hint" : "Show next hint";
    } else {
      hintBtn.disabled = true;
      hintBtn.textContent = hintCount === 0 ? "A hint unlocks after your first try" : "Next hint unlocks after your next try";
    }
  }
  hintBtn.addEventListener("click", function () {
    if (hintCount < Math.min(HINTS.length, rowIndex)) {
      hintCount++;
      renderHints();
    }
  });

  function evaluate(guess, answer) {
    var result = [], pool = {}, i;
    for (i = 0; i < answer.length; i++) {
      result[i] = "absent";
      if (guess[i] === answer[i]) result[i] = "correct";
      else pool[answer[i]] = (pool[answer[i]] || 0) + 1;
    }
    for (i = 0; i < answer.length; i++) {
      if (result[i] === "correct") continue;
      if (pool[guess[i]] > 0) { result[i] = "present"; pool[guess[i]]--; }
    }
    return result;
  }

  function build() {
    board.innerHTML = "";
    rows = []; tiles = [];
    for (var r = 0; r < ROWS; r++) {
      var row = document.createElement("div");
      row.className = "row";
      var rowTiles = [];
      for (var c = 0; c < COLS; c++) {
        var t = document.createElement("div");
        t.className = "tile";
        row.appendChild(t);
        rowTiles.push(t);
      }
      board.appendChild(row);
      rows.push(row); tiles.push(rowTiles);
    }
  }

  var LAYOUT = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  function buildKeyboard() {
    kb.innerHTML = "";
    keys = {};
    LAYOUT.forEach(function (letters, idx) {
      var row = document.createElement("div");
      row.className = "kb-row";
      if (idx === 2) row.appendChild(makeKey("ENTER", "Enter", true));
      letters.split("").forEach(function (ch) { row.appendChild(makeKey(ch, ch, false)); });
      if (idx === 2) row.appendChild(makeKey("DEL", "Backspace", true));
      kb.appendChild(row);
    });
  }
  function makeKey(label, value, wide) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "key" + (wide ? " wide" : "");
    b.textContent = label;
    b.setAttribute("data-key", value);
    b.setAttribute("aria-label", value === "Backspace" ? "Delete" : value);
    b.addEventListener("click", function () { handle(value); });
    if (!wide) keys[value] = b;
    return b;
  }

  function showToast(msg) {
    toast.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.textContent = ""; }, 1600);
  }

  function paintRow() {
    var rt = tiles[rowIndex];
    for (var i = 0; i < COLS; i++) {
      var ch = current[i] || "";
      rt[i].textContent = ch;
      rt[i].setAttribute("data-filled", ch ? "true" : "false");
    }
  }

  function rank(s) { return s === "correct" ? 3 : s === "present" ? 2 : s === "absent" ? 1 : 0; }
  function paintKey(letter, state) {
    var k = keys[letter];
    if (!k) return;
    if (rank(state) > rank(k.getAttribute("data-state"))) k.setAttribute("data-state", state);
  }

  function submit() {
    if (current.length < COLS) {
      rows[rowIndex].classList.remove("shake");
      void rows[rowIndex].offsetWidth;
      rows[rowIndex].classList.add("shake");
      showToast("Not enough letters");
      return;
    }
    var guess = current;
    var result = evaluate(guess, ANSWER);
    var r = rowIndex;
    locked = true;
    for (var i = 0; i < COLS; i++) {
      (function (i) {
        var t = tiles[r][i];
        t.style.animationDelay = (i * STEP) / 1000 + "s";
        t.classList.add("flip");
        setTimeout(function () {
          t.setAttribute("data-state", result[i]);
          paintKey(guess[i], result[i]);
        }, i * STEP + (reduce ? 0 : 250));
      })(i);
    }
    var total = (COLS - 1) * STEP + (reduce ? 0 : 500);
    setTimeout(function () {
      locked = false;
      if (guess === ANSWER) {
        over = true;
        winEl.hidden = false;
        winEl.classList.remove("show");
        void winEl.offsetWidth;
        winEl.classList.add("show");
      } else if (r === ROWS - 1) {
        over = true;
        loseEl.hidden = false;
        loseEl.innerHTML = "Out of tries. The word was <strong>" + ANSWER + "</strong>.<br>";
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Try again";
        btn.addEventListener("click", reset);
        loseEl.appendChild(btn);
      }
    }, total + 60);
    rowIndex++;
    current = "";
    renderHints();
  }

  function handle(value) {
    if (locked || over) return;
    if (value === "Enter") { submit(); return; }
    if (value === "Backspace") {
      current = current.slice(0, -1);
      paintRow();
      return;
    }
    if (/^[A-Z]$/.test(value) && current.length < COLS) {
      current += value;
      paintRow();
    }
  }

  function reset() {
    current = ""; rowIndex = 0; locked = false; over = false;
    winEl.hidden = true; winEl.classList.remove("show");
    loseEl.hidden = true; loseEl.innerHTML = "";
    toast.textContent = "";
    hintCount = 0;
    renderHints();
    build();
    buildKeyboard();
  }

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
      handle("Enter");
    } else if (k === "Backspace") {
      handle("Backspace");
    } else if (/^[a-zA-Z]$/.test(k)) {
      handle(k.toUpperCase());
    }
  });

  reset();
})();
</script>

</body>
</html>
